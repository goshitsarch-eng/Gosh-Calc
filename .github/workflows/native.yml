name: Native validation and packages
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            system: linux
            arch: aarch64
          - runner: windows-2022
            system: windows
            arch: x86_64
          - runner: macos-14
            system: darwin
            arch: aarch64
          - runner: macos-15-intel
            system: darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb dbus-x11 appstream desktop-file-utils
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Rust quality and regression tests
        run: python scripts/verify.py
      - name: Build UI QA executable
        run: cargo build --locked --features ui-test
      - name: Linux desktop UI suite
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python scripts/smoke.py target/debug/gosh-calc
      - name: Windows desktop UI suite
        if: runner.os == 'Windows'
        run: python scripts/smoke.py target/debug/gosh-calc.exe
      - name: macOS desktop UI suite
        if: runner.os == 'macOS'
        run: python scripts/smoke.py target/debug/gosh-calc
      - name: Build production executable
        run: cargo build --release --locked
      - name: Package and inspect native artifacts
        run: |
          python scripts/package.py --arch ${{ matrix.arch }}
          python scripts/verify_release.py --dir dist --version $(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
        shell: bash
      - name: Install, upgrade and uninstall Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $previous = Join-Path $env:RUNNER_TEMP 'previous.msi'
          wix build packaging/windows/main.wxs -arch x64 -d Version=0.1.0 -d "SourceDir=$PWD/target/release" -d "ProjectDir=$PWD" -o $previous
          if ($LASTEXITCODE) { throw 'Previous-version MSI fixture failed to build' }
          foreach ($package in $previous, $msi) {
            $process = Start-Process msiexec.exe -ArgumentList "/i `"$package`" /qn ADDLOCAL=Main,Desktop /l*v install.log" -PassThru -Wait
            if ($process.ExitCode -notin 0,3010) { Get-Content install.log; throw "MSI install failed: $($process.ExitCode)" }
          }
          $installed = Join-Path $env:LOCALAPPDATA 'Gosh Calc/gosh-calc.exe'
          if (!(Test-Path $installed)) { throw 'Installed executable missing' }
          if (!(Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/Gosh Calc/Gosh Calc.lnk")) { throw 'Start Menu shortcut missing' }
          $process = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -PassThru -Wait
          if ($process.ExitCode -notin 0,3010) { Get-Content uninstall.log; throw 'MSI uninstall failed' }
          if (Test-Path $installed) { throw 'Executable remains after uninstall' }
      - name: Inspect macOS code signature
        if: runner.os == 'macOS'
        run: |
          mkdir unpacked
          ditto -x -k dist/*.zip unpacked
          codesign --verify --deep --strict --verbose=2 'unpacked/Gosh Calc.app'
      - name: Validate Linux metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate resources/dev.goshapps.calc.desktop
          appstreamcli validate --pedantic resources/dev.goshapps.calc.metainfo.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-native-${{ matrix.system }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
