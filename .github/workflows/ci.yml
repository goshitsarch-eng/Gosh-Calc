# Continuous integration: fast feedback on every branch push and PR.
# Never publishes anything. The release publisher is release.yml (tag-only).
name: CI

on:
  push:
    branches: ['**'] # branches only; tags go to release.yml
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt / build / clippy / test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-12
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Install system dependencies
        # The GUI stack is dlopen-based, so this is belt-and-braces insurance
        # for crates that may link these at build time.
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          pkg-config libwayland-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
