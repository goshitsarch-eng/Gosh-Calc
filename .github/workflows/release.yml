name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  GODOT_VERSION: 4.7.2
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install display and GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libgl1-mesa-dri libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64 fontconfig zip
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo install -m755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != project version v$version"; exit 1; }
      - run: scripts/test.sh
      - run: scripts/export.sh
      - name: Verify every expected package exists and checksums match
        run: |
          cd dist
          for f in linux-x86_64.tar.gz linux-aarch64.tar.gz windows-x86_64.zip macos-universal.zip; do
            ls ./*-"$f" > /dev/null
          done
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
