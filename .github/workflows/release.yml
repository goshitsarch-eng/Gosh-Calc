name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_gate.py
  native:
    needs: gate
    uses: ./.github/workflows/native.yml
  flatpak:
    needs: gate
    uses: ./.github/workflows/flatpak.yml
  publish:
    needs: [gate, native, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Assemble checksums and require the complete platform set
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); from package import checksums; from pathlib import Path; checksums(Path('dist'))"
          python scripts/verify_release.py --dir dist --version "$VERSION" --full
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: ${{ github.ref_name }}
          name: Gosh Calc ${{ needs.gate.outputs.version }}
          prerelease: ${{ needs.gate.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.msi
            dist/*.zip
            dist/*.tar.gz
            dist/*.flatpak
            dist/SHA256SUMS
