name: Flatpak sandbox validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install builder and GNOME WebKit runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils debugedit appstream-compose librsvg2-common xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build and install QA bundle
        run: |
          python scripts/flatpak.py --ui-test --out qa-dist
          flatpak install --user -y qa-dist/*.flatpak
      - name: Exercise UI inside the Flatpak sandbox
        run: xvfb-run -a dbus-run-session -- python scripts/smoke.py --flatpak
      - name: Build production bundle without test hooks
        run: python scripts/flatpak.py --out dist
      - name: Inspect production bundle
        run: |
          flatpak install --user -y --reinstall dist/*.flatpak
          flatpak info --user --show-permissions dev.goshapps.calc
          flatpak run --user dev.goshapps.calc --version
          python scripts/verify_release.py --dir dist --version $(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-flatpak-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
