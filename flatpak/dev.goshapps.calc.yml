app-id: dev.goshapps.calc
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gosh-calc
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/gosh-calc/cargo-home
    CARGO_NET_OFFLINE: "true"
    CARGO_BUILD_JOBS: "4"
    RUSTFLAGS: "-L native=/app/lib"
modules:
  - name: libxdo
    buildsystem: simple
    build-commands:
      - make libxdo.so
      - install -Dm755 libxdo.so /app/lib/libxdo.so.3
      - ln -s libxdo.so.3 /app/lib/libxdo.so
    sources:
      - type: archive
        url: https://deb.debian.org/debian/pool/main/x/xdotool/xdotool_3.20160805.1.orig.tar.gz
        sha256: 1723c48b9b437a9637a2ddf3011c19df96dd0f9eba44478e40a5f5419f6d5a56
  - name: gosh-calc
    buildsystem: simple
    build-commands:
      - mkdir -p .cargo
      - cp cargo/config.toml .cargo/config.toml
      - cargo build --release --locked --offline
      - install -Dm755 target/release/gosh-calc /app/bin/gosh-calc
      - install -Dm644 resources/dev.goshapps.calc.desktop
        /app/share/applications/dev.goshapps.calc.desktop
      - install -Dm644 resources/dev.goshapps.calc.metainfo.xml
        /app/share/metainfo/dev.goshapps.calc.metainfo.xml
      - install -Dm644 resources/icons/hicolor/scalable/apps/dev.goshapps.calc.svg
        /app/share/icons/hicolor/scalable/apps/dev.goshapps.calc.svg
    sources:
      - type: dir
        path: ../src
        dest: src
      - type: dir
        path: ../resources
        dest: resources
      - type: file
        path: ../Cargo.toml
      - type: file
        path: ../Cargo.lock
      - type: dir
        path: ../tests
        dest: tests
      - type: dir
        path: ../vendor
        dest: vendor
      - type: file
        path: ../build.rs
      - cargo-sources.json
