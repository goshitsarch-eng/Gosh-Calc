# Local-bundle manifest. It packages the Godot export produced by
# scripts/export.sh (build/linux-<arch>/...); it does not build Godot itself,
# and it is not a Flathub submission. See BUILDING.md.
app-id: dev.goshapps.calc
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: gosh-calc
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: gosh-calc
    buildsystem: simple
    build-commands:
      - install -Dm755 gosh-calc /app/bin/gosh-calc
      - install -Dm644 dev.goshapps.calc.desktop /app/share/applications/dev.goshapps.calc.desktop
      - install -Dm644 dev.goshapps.calc.metainfo.xml /app/share/metainfo/dev.goshapps.calc.metainfo.xml
      - install -Dm644 dev.goshapps.calc.svg /app/share/icons/hicolor/scalable/apps/dev.goshapps.calc.svg
      - install -Dm644 LICENSE /app/share/licenses/dev.goshapps.calc/LICENSE
      - install -Dm644 THIRD_PARTY_LICENSES.md /app/share/licenses/dev.goshapps.calc/THIRD_PARTY_LICENSES.md
    sources:
      - type: file
        path: ../build/linux-x86_64/gosh-calc.x86_64
        dest-filename: gosh-calc
      - type: file
        path: ../resources/dev.goshapps.calc.desktop
      - type: file
        path: ../resources/dev.goshapps.calc.metainfo.xml
      - type: file
        path: ../assets/icon.svg
        dest-filename: dev.goshapps.calc.svg
      - type: file
        path: ../LICENSE
      - type: file
        path: ../THIRD_PARTY_LICENSES.md
